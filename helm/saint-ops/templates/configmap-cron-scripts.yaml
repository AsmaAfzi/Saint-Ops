apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "saint-ops.fullname" . }}-cron-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saint-ops.labels" . | nindent 4 }}
data:
  k8s_drift_report.py: |
{{ .Files.Get "files/k8s_drift_report.py" | indent 4 }}
  k8s_data_freshness.py: |
{{ .Files.Get "files/k8s_data_freshness.py" | indent 4 }}
