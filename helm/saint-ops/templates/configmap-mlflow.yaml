apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "saint-ops.fullname" . }}-mlflow-entrypoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "saint-ops.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e
    ARTIFACT_ROOT="${MLFLOW_ARTIFACT_ROOT:-/mlflow/artifacts}"
    BACKEND_STORE="${MLFLOW_BACKEND_STORE_URI:-sqlite:///mlflow/mlflow.db}"
    echo "MLflow artifact root: ${ARTIFACT_ROOT}"
    exec mlflow server \
      --host 0.0.0.0 \
      --backend-store-uri "${BACKEND_STORE}" \
      --artifacts-destination "${ARTIFACT_ROOT}" \
      --serve-artifacts
