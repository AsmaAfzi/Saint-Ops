services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saint-backend
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      ARTIFACTS_DIR: /app/artifacts
      MODELS_DIR: /app/models
      STREAM_CSV: /app/data/scenario_C_annulus.csv
    volumes:
      - ./artifacts:/app/artifacts
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - saint-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saint-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saint-network

  # Optional: train in Linux container if TensorFlow fails on Windows host
  #   docker compose run --rm train
  train:
    build:
      context: .
      dockerfile: ml/Dockerfile
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./ml:/app/ml
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - saint-network
    profiles:
      - train

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: saint-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    networks:
      - saint-network

networks:
  saint-network:
    driver: bridge